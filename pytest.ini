# Harness config lives HERE, not in pyproject.toml: the Phase -1 manifest
# (phase-minus-one/manifest.json) pins pyproject.toml and uv.lock by hash as
# part of the sealed experiment authority, so those files must stay
# byte-identical. pytest.ini takes precedence over [tool.pytest.ini_options].
#
# - A bare `pytest` runs the sealed conformance suite only (the documented
#   invocation in CONFORMANCE.md).
# - The living suite runs with `pytest tests`.
# - pythonpath: `pilots` exposes the frozen top-level modules (engine, render,
#   hand, judge); `.` exposes the golem package.
[pytest]
addopts = -ra
pythonpath = pilots .
testpaths = conformance
