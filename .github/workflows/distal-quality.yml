name: distal-quality

on:
  pull_request:
    branches: [agent-validation]
  push:
    branches:
      - agent-validation
      - sol/distal-character-vascular-quality
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-vascular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install sealed environment
        run: uv sync --frozen
      - name: Semantic and final-systems laws
        run: uv run python tools/test_release.py
      - name: Distal quality and vascular regression
        run: uv run pytest -q tests/test_distal_quality.py
      - name: Validate machine-readable receipts
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          for name in ('distal-quality-report.json', 'vascular-regression-report.json'):
              path = Path('out/validation') / name
              payload = json.loads(path.read_text())
              assert payload, f'{name} is empty'
          PY
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distal-quality-and-vascular-evidence
          path: |
            out/validation/*.json
            out/validation/*.log
            out/**/creature_views.png
            out/**/creature_turntable.gif
            out/**/surface_certificate.json
          if-no-files-found: warn
